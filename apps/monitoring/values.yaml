prometheus:
  prometheusSpec:
    retention: 30d
    retentionSize: 4GB

    scrapeInterval: 30s
    evaluationInterval: 30s

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}

    serviceMonitorNamespaceSelector: {}

    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}

    podMonitorNamespaceSelector: {}

    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}

    ruleNamespaceSelector: {}

alertmanager:
  enabled: true

  alertmanagerSpec:
    secrets:
      - slack-webhook
    retention: 120h
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: slack-default
      group_by:
        - alertname
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

      routes:
        - matchers:
            - severity="critical"
          receiver: slack-critical
          repeat_interval: 1h

        - matchers:
            - severity="warning"
          receiver: slack-warning
          repeat_interval: 4h

    receivers:
      - name: slack-default

      - name: slack-critical
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook/webhook_url
            channel: "#platform-alerts"
            send_resolved: true
            title: '{{ .CommonLabels.alertname }}'
            text: |
              *Severity:* {{ .CommonLabels.severity }}
              *Namespace:* {{ .CommonLabels.namespace }}
              *Pod:* {{ .CommonLabels.pod }}
              *Summary:* {{ .CommonAnnotations.summary }}
              *Description:* {{ .CommonAnnotations.description }}

      - name: slack-warning
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook/webhook_url
            channel: "#platform-alerts"
            send_resolved: true
            title: 'WARNING: {{ .CommonLabels.alertname }}'
            text: |
              *Namespace:* {{ .CommonLabels.namespace }}
              *Pod:* {{ .CommonLabels.pod }}
              *Summary:* {{ .CommonAnnotations.summary }}

    templates: []

grafana:
  enabled: true

  adminUser: admin
  adminPassword: ChangeMe123!

  persistence:
    enabled: true
    size: 10Gi
    storageClassName: standard

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      provider:
       allowUiUpdates: true

    datasources:
      enabled: true
      defaultDatasourceEnabled: true

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
