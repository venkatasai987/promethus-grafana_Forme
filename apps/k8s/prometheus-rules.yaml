apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: monitoring-demo-alerts
  namespace: monitoring
  labels:
    release: monitoring

spec:
  groups:
    - name: application-alerts
      interval: 30s
      rules:

        # App1 memory usage > 90% of container limit
        - alert: App1HighMemoryUsage
          expr: |
            (
              container_memory_working_set_bytes{
                namespace="monitoring-demo",
                container="counter-app1"
              }
              /
              on(namespace,pod,container)
              kube_pod_container_resource_limits{
                namespace="monitoring-demo",
                container="counter-app1",
                resource="memory",
                unit="byte"
              }
            ) * 100 > 90
          for: 2m
          labels:
            severity: critical
            application: app1
          annotations:
            summary: App1 container memory usage is above 90%
            description: "Pod {{ $labels.pod }} is using over 90% of its memory limit for 2 minutes."

        # App2 memory usage > 90% of container limit
        - alert: App2HighMemoryUsage
          expr: |
            (
              container_memory_working_set_bytes{
                namespace="monitoring-demo",
                container="counter-app2"
              }
              /
              on(namespace,pod,container)
              kube_pod_container_resource_limits{
                namespace="monitoring-demo",
                container="counter-app2",
                resource="memory",
                unit="byte"
              }
            ) * 100 > 90
          for: 2m
          labels:
            severity: critical
            application: app2
          annotations:
            summary: App2 container memory usage is above 90%
            description: "Pod {{ $labels.pod }} is using over 90% of its memory limit for 2 minutes."

        # Pod restarting too frequently
        - alert: ContainerHighRestartCount
          expr: |
            increase(
              kube_pod_container_status_restarts_total{
                namespace="monitoring-demo"
              }[10m]
            ) > 5
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Container restarted more than 5 times
            description: "Pod {{ $labels.pod }} container {{ $labels.container }} restarted repeatedly."

        # Node memory > 85%
        - alert: NodeHighMemoryUsage
          expr: |
            (
              1 -
              node_memory_MemAvailable_bytes
              /
              node_memory_MemTotal_bytes
            ) * 100 > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Node memory usage is high
            description: "Node {{ $labels.instance }} memory usage is above 85%."

        # Node root filesystem usage > 80%
        - alert: NodeDiskUsageHigh
          expr: |
            (
              1 -
              node_filesystem_avail_bytes{
                mountpoint="/",
                fstype!~"tmpfs|overlay|squashfs"
              }
              /
              node_filesystem_size_bytes{
                mountpoint="/",
                fstype!~"tmpfs|overlay|squashfs"
              }
            ) * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Node root filesystem usage is high
            description: "Node {{ $labels.instance }} root filesystem is above 80%."

        # Node exporter target down
        - alert: NodeExporterDown
          expr: up{job=~".*node-exporter.*"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: Node Exporter is down
            description: "Node Exporter target {{ $labels.instance }} is unavailable."
